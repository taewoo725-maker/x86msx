; 만든이: KimTaeWoo
; 도와준이: Lee.J.H
; X86MSX 무선랜 시험 (Realtek RTL8822CE, 시험 PC 1번 Lenovo V14-ARE). USB 루트의 DRV\RTW.INI 로 복사.
; POWER=1 이면 켠 뒤 5초쯤에 무선 칩 전원 켜기(1단계)를 한 번 시도하고 LOG\WIFI_X<버전>.TXT 에 결과를 남긴다.
; 이 줄이 없거나 파일이 없으면 아무것도 하지 않는다 (칩이 없는 PC에서는 어차피 아무 일도 없다).
POWER=1
; 같은 폴더의 rtw8822c_fw.bin(Realtek 펌웨어, 수정 없이 배포 / 라이선스: LICENCE.rtlwifi_firmware.txt)을 읽어 헤더를 검사한다.
; 5.0.136: 아래 FWDL 줄의 값이 1이면 펌웨어를 칩 안에 올려 보기까지 한다 (2b단계). 문제가 있으면 이 줄을 지운다.
FWDL=1
; 5.0.149: 무선랜 전체 과정을 두 번째 CPU 코어에서 실행해 MSX 에뮬레이션이 멈추지 않게 한다 (기본). 두 번째 코어를 쓸 수 없으면 로그에 사유를 남기고 이 코어에서 막고 실행한다.
; 비교 시험용으로 두 번째 코어를 끄고 싶으면 아래 줄의 앞 ; 를 지운다.
;CORE=0
; 5.0.150: 공유기에 접속해 보려면 아래 두 줄의 앞 ; 를 지우고 이름과 비밀번호를 쓴다 (WPA2-PSK/AES, 2.4GHz). 줄 끝까지가 값이다(공백 포함).
; 5.0.163: 평소(실시간) 모드에서는 이 두 줄을 쓰지 않는다 — 네트워크 창에서 무선 네트워크를 찾아 고르고 암호를 치면 된다. 아래는 LIVE=0 진단 흐름 전용.
; 접속 순서: 인증 → 결합 → WPA2 4-way → DHCP(IP 받기) → 게이트웨이 ARP·ping. 결과는 LOG\WIFI_X<버전>.TXT 의 WIFI.auth/assoc/eapol/dhcp/arp/ping/conn 줄.
;SSID=공유기이름
;PASS=비밀번호
